<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin — Cornell Rugby{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <style>
    body { background: #f0f2f5; }
    .admin-topbar {
      background: #1a1a1a;
      color: #ccc;
      padding: 0 1.25rem;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.875rem;
    }
    .admin-topbar strong { color: #fff; }
    .admin-topbar a { color: #aaa; margin-left: auto; }
    .admin-topbar a:hover { color: #fff; }
    .flash-success { background:#dcfce7; border-left:4px solid #16a34a; color:#166534; padding:0.75rem 1rem; border-radius:4px; margin-bottom:1rem; font-size:0.875rem; }
    .flash-info    { background:#dbeafe; border-left:4px solid #2563eb; color:#1e40af; padding:0.75rem 1rem; border-radius:4px; margin-bottom:1rem; font-size:0.875rem; }
    .flash-error   { background:#fee2e2; border-left:4px solid #dc2626; color:#991b1b; padding:0.75rem 1rem; border-radius:4px; margin-bottom:1rem; font-size:0.875rem; }
  </style>
</head>
<body>
  <div class="admin-topbar">
    <strong>Cornell Rugby — Admin Panel</strong>
    <a href="{{ url_for('home') }}">← View Site</a>
  </div>
  <div class="admin-wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash-{{ category }} mt-2">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
