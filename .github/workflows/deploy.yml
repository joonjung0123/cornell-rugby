name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            git -C /var/www/cornellrugby pull origin main
            /var/www/cornellrugby/venv/bin/pip install -r /var/www/cornellrugby/requirements.txt --quiet
            sudo systemctl restart cornellrugby
