# Redirect HTTP → HTTPS
server {
    listen 80;
    # CUSTOMIZE: Replace with your actual domain
    server_name cornellrugby.com www.cornellrugby.com;

    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    # CUSTOMIZE: Replace with your actual domain
    server_name cornellrugby.com www.cornellrugby.com;

    # CUSTOMIZE: Update these paths after running Certbot
    ssl_certificate     /etc/letsencrypt/live/cornellrugby.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cornellrugby.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Serve static files directly (faster, bypasses Flask)
    location /static/ {
        # CUSTOMIZE: Update to absolute path of your static/ folder
        alias /home/cornellrugby/cornell-rugby/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Forward everything else to Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
